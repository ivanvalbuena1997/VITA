<!doctype html>
<html lang="es" data-theme="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080C">
<title>V.I.T.A.</title>
<meta name="description" content="Entreno, comida y actividad de Iván en una sola app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/orbitron-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/rajdhani-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/vita.css">
<script>
  // Pinta el tema guardado antes de cargar nada, para no ver un parpadeo
  try { var t = localStorage.getItem("vita:tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<!-- Mismo dibujo que logoCarga() en js/icons.js -->
<div class="cargando-vita" role="status"><svg width="120" height="120" viewBox="0 0 240 240" aria-hidden="true" class="logo-carga">
  <circle cx="120" cy="120" r="104" fill="none" stroke="var(--acc)" stroke-width="10" opacity="0.5"/>
  <path d="M28 124 H76 L86 106 L96 124 L120 176 L152 64 L164 124 H212" fill="none" stroke="var(--acc)" stroke-width="18" stroke-linejoin="miter" stroke-linecap="square"/>
</svg><span class="sr-only">Cargando V.I.T.A.</span></div>
<noscript><p style="padding:24px">V.I.T.A. necesita JavaScript.</p></noscript>
<script>
  // Si hay una versión nueva ya descargada, se aplica al abrir la app.
  if ("serviceWorker" in navigator && location.search.indexOf("local") < 0) {
    var vitaRecarga = false, vitaHabia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (vitaHabia && !vitaRecarga) { vitaRecarga = true; location.reload(); } });
    navigator.serviceWorker.getRegistration().then(function (r) {
      if (r && r.waiting && navigator.serviceWorker.controller) r.waiting.postMessage("activar");
    }).catch(function () {});
  }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
