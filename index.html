<!doctype html>
<html lang="es" data-theme="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080C">
<title>V.I.T.A.</title>
<meta name="description" content="Entreno, comida y actividad de Iván en una sola app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/orbitron-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/rajdhani-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/vita.css">
<script>
  // Pinta el tema guardado antes de cargar nada, para no ver un parpadeo
  try { var t = localStorage.getItem("vita:tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="login"><p class="muted">Cargando V.I.T.A.…</p></div>
<noscript><p style="padding:24px">V.I.T.A. necesita JavaScript.</p></noscript>
<script>
  // Si hay una versión nueva ya descargada, se aplica al abrir la app.
  // Este archivo siempre llega fresco de la red, así que también rescata
  // versiones antiguas de la app que no llegaban a mostrar el aviso.
  if ("serviceWorker" in navigator && location.search.indexOf("local") < 0) {
    var vitaRecarga = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (!vitaRecarga) { vitaRecarga = true; location.reload(); } });
    navigator.serviceWorker.getRegistration().then(function (r) {
      if (r && r.waiting && navigator.serviceWorker.controller) r.waiting.postMessage("activar");
    }).catch(function () {});
  }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
